[tools]
pixi = "latest"

[tasks.install]
description = "Install the Pixi-managed Mojo environment"
run = "pixi install"

[tasks.mojo-version]
description = "Print the Pixi-managed Mojo version"
run = "pixi run mojo-version"

[tasks.mojo]
description = "Run Mojo through Pixi"
run = "pixi run mojo \"$@\""

[tasks.hello]
description = "Run the Mojo hello smoke test"
run = "pixi run hello"

[tasks.ooboo]
description = "Run the ooboo Mojo CLI"
run = "pixi run ooboo \"$@\""
