[tools]
uv = "latest"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"
UV_CACHE_DIR = ".uv-cache"
UV_PYTHON_INSTALL_DIR = ".uv-python"

[tasks.install]
description = "Install project-local Mojo environment"
run = "uv sync"

[tasks.mojo-version]
description = "Print the project-local Mojo version"
run = "uv run mojo --version"

[tasks.mojo]
description = "Run Mojo with project-local dependencies"
run = "uv run mojo \"$@\""
